<body>
    <section>
        <div class="container">
            <p id="one"> Welcome Back</p>
            <p id="two">Login to your account</p>

            <p id="three">Email:</p>
            <input
                type="text"
                placeholder="Enter your email"
                required   
            >

            <p id="pass">Password:</p>
            <input
                type="password"
                placeholder="Enter your password"
                required   
            >

            <div class="options">
                <label>
                    <input type="checkbox">
                    Remember me
                </label>
                <a href="#">Forgot?</a>
            </div>
            
           

            <button id="btn">Login</button>

            <div class="last">
                <p id="dont">Don't have account?</p>
                <a href="#">Sign Up</a> 
            </div>
        </div>
